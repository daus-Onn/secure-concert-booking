<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Login - SecureConcert</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; color: white; }
        .card { background-color: #1e1e1e; border: none; border-radius: 15px; }
        .btn-gold { background-color: #fbbc05; color: #000; font-weight: bold; border-radius: 20px; }
        input { width: 100%; padding: 8px; margin-bottom: 15px; border-radius: 5px; background-color: #2c2c2c; color: white; border: 1px solid #444; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center vh-100">
    <div class="card p-4 shadow-lg" style="width: 25rem;">
        <h3 class="text-center mb-4 fw-bold" style="color: #fbbc05;">Login</h3>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-gold w-100 mt-2">Sign In</button>
        </form>
        <div class="text-center mt-3">
            <a href="{% url 'register' %}" class="text-secondary text-decoration-none">New here? Register</a>
        </div>
    </div>
</body>
</html>
